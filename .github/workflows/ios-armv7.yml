          +  sceGuDepthRange(65535, 0); sceGuScissor(0, 0, 480, 272); sceGuEnable(GU_SCISSOR_TEST);
          +  sceGuDepthFunc(GU_GEQUAL); sceGuEnable(GU_DEPTH_TEST); sceGuDisable(GU_CULL_FACE); sceGuDisable(GU_TEXTURE_2D); sceGuDisable(GU_BLEND); sceGuDisable(GU_ALPHA_TEST);
