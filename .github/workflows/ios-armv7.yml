name: Build SHAR iOS armv7 (iOS 7+)

# GitHub -> Actions -> "Build SHAR iOS armv7 (iOS 7+)" -> Run workflow. Artifact: SHAR-armv7.ipa (+ .deb).
# No game data is needed or included: convert your own PS2 disc with the repo tools and copy the result into
# the app's Documents/SHARVIEW folder (iTunes file sharing / Filza / scp).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", "viewer/**", ".github/workflows/ios-armv7.yml"]

permissions:
  contents: read

jobs:
  host-check:
    name: Engine compiles against the PSP shim (x86_64, syntax only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check engine + shim
        working-directory: viewer
        run: |
          set -e
          CF="-I../ios/shim -I. -std=gnu11 -fsyntax-only -w -include msio.h -include geguard.h -Dmain=shar_main"
          SRC=$(grep -o 'add_executable(sharview [^)]*' CMakeLists.txt | sed 's/add_executable(sharview //')
          for f in $SRC fxdsp.c collectfx.c camsafe.c; do
            # savemenu.c has a sizeof()==1536 assert that only holds for 32-bit pointers
            [ "$f" = savemenu.c ] && continue
            gcc $CF "$f" || { echo "::error::$f"; exit 1; }
          done
          for f in ../ios/src/ge_list.c ../ios/src/psp_sys.c ../ios/src/me_stub.c; do gcc -fsyntax-only -w -I../ios/shim "$f"; done

  build-ios-armv7:
    name: iOS armv7 (Theos, iOS 7.0 - 9.3.5)
    needs: host-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl curl ca-certificates zip unzip xz-utils bzip2 git fakeroot make

      - name: Install Theos + iOS toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iPhoneOS 9.3 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/iphoneos9.3.sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/iphoneos9.3.sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done

      - name: Patch ios/Makefile (idempotent; keeps all packaging fixes inside this workflow)
        working-directory: ios
        run: |
          set -euo pipefail
          # ios_host.m is written for ARC; the per-file key in the Makefile does not match paths in FILES
          grep -q 'SHARArmv7_OBJCFLAGS' Makefile || printf '\nSHARArmv7_OBJCFLAGS += -fobjc-arc\n' >> Makefile
          # Theos only picks ./Info.plist, not Resources/Info.plist -> copy it (and launch images) into the staged .app; postinst must be executable
          if ! grep -q '^internal-stage::' Makefile; then
            printf '\ninternal-stage::\n\t$(ECHO_NOTHING)mkdir -p $(THEOS_STAGING_DIR)/Applications/$(APPLICATION_NAME).app && cp Resources/Info.plist Resources/LaunchImage*.png $(THEOS_STAGING_DIR)/Applications/$(APPLICATION_NAME).app/$(ECHO_END)\n\t$(ECHO_NOTHING)chmod 755 $(THEOS_STAGING_DIR)/DEBIAN/postinst 2>/dev/null || true$(ECHO_END)\n' >> Makefile
          fi
          tail -8 Makefile

      - name: Add .deb postinst (creates the game data folder on install)
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p layout/DEBIAN
          cat > layout/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          # Runs after the .deb is installed (Cydia / Sileo / Zebra / dpkg -i).
          # Creates the folder where the converted game data must be copied.
          # Must stay in sync with ios_host.m: apps in /Applications use /var/mobile/Documents.
          case "$1" in
            configure|"") ;;
            *) exit 0 ;;
          esac
          GAME_DIR="/var/mobile/Documents/SHARVIEW"
          mkdir -p "$GAME_DIR"
          chown mobile:mobile /var/mobile/Documents "$GAME_DIR" 2>/dev/null
          chmod 755 "$GAME_DIR"
          if [ ! -f "$GAME_DIR/PUT_GAME_DATA_HERE.txt" ]; then
            printf '%s\n' \
              "Put the converted game data (made from your own disc) into THIS folder:" \
              "  /var/mobile/Documents/SHARVIEW" \
              "Copy with Filza, scp/sftp or iFunBox, then restart the game." \
              "Log: /var/mobile/Documents/shar_ios.log" > "$GAME_DIR/PUT_GAME_DATA_HERE.txt"
            chown mobile:mobile "$GAME_DIR/PUT_GAME_DATA_HERE.txt" 2>/dev/null
          fi
          command -v uicache >/dev/null 2>&1 && uicache >/dev/null 2>&1
          echo "SHAR: game data folder ready -> $GAME_DIR"
          exit 0
          EOF
          chmod 755 layout/DEBIAN/postinst
          sh -n layout/DEBIAN/postinst

      - name: Patch ios_host.m (use /var/mobile/Documents when installed from .deb)
        working-directory: ios
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p = "host/ios_host.m"
          s = open(p, encoding="utf-8").read()
          if "/var/mobile/Documents" not in s:
              old = "NSString *d = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0]; strlcpy"
              new = ("NSString *d = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0];\n"
                     "  /* installed from .deb into /Applications: data lives in /var/mobile/Documents/SHARVIEW (created by DEBIAN/postinst) */\n"
                     "  if ([[[NSBundle mainBundle] bundlePath] hasPrefix:@\"/Applications/\"] && access(\"/var/mobile/Documents\", W_OK) == 0) d = @\"/var/mobile/Documents\";\n"
                     "  strlcpy")
              assert old in s, "ios_host.m: anchor not found"
              open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
          print("ios_host.m patched")
          PY
          grep -n "var/mobile/Documents" host/ios_host.m

      - name: Patch psp_sys.c (pass sceKernelStartThread args to the thread - fixes NULL crash in movie/audio threads)
        working-directory: ios
        run: |
          set -euo pipefail
          timeout 60 python3 - <<'PY'
          for p in ("src/psp_sys.c", "shim/psp_sys.c"):
              s = open(p, encoding="utf-8").read()
              if "unsigned char arg[128]" in s:
                  print(p, "already patched"); continue
              reps = [
                ("typedef struct { pthread_t t; SceKernelThreadEntry fn; int started, done, id; char name[32]; } Th;",
                 "typedef struct { pthread_t t; SceKernelThreadEntry fn; int started, done, id; char name[32]; unsigned char arg[128]; unsigned al; } Th;"),
                ("t->fn(0, 0);", "t->fn(t->al, t->al ? (void *)t->arg : (void *)0);"),
                ("(void)al; (void)ap; pthread_attr_t at;",
                 "t->al = al > 128 ? 128 : al; if (ap && t->al) memcpy(t->arg, ap, t->al); pthread_attr_t at;"),
              ]
              for old, new in reps:
                  assert old in s, p + ": anchor not found: " + old[:40]
                  s = s.replace(old, new, 1)
              open(p, "w", encoding="utf-8").write(s)
              print(p, "patched")
          PY
          grep -n "t->al" src/psp_sys.c | cut -c1-160

      - name: Patch ge_gles2.c (fixes texture upload crash - stale mip levels or short buffer, KERN_PROTECTION_FAILURE in memcpy)
        working-directory: ios
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p = "src/ge_gles2.c"
          s = open(p, encoding="utf-8").read()
          if "safe_copy" in s:
              print(p, "already patched")
          else:
              reps = [
              (r"""""",
               r"""#ifdef __APPLE__
          #include <mach/mach.h>
          #include <mach/vm_map.h>
          #endif

          /* safe_copy: memcpy from a pointer that may be stale / too short. The GE list carries raw PSP-style pointers and
           * per-level sizes; if a texture level is described bigger than the buffer behind it, a plain memcpy walks into a
           * guard page (EXC_BAD_ACCESS, KERN_PROTECTION_FAILURE). Here unreadable pages are zero-filled and counted instead.
           * Fast path = one vm_read_overwrite for the whole range; page-by-page only when that fails. Returns bytes that were readable. */
          static unsigned bad_reads;
          static size_t safe_copy(void *dst, const void *src, size_t n) {
          #ifdef __APPLE__
            uint8_t *d = (uint8_t *)dst; uintptr_t s = (uintptr_t)src; vm_size_t got = 0;
            if (!n) return 0;
            if (vm_read_overwrite(mach_task_self(), (vm_address_t)s, (vm_size_t)n, (vm_address_t)d, &got) == KERN_SUCCESS && got == n) return n;
            size_t ok = 0, off = 0; const size_t PG = 4096;
            while (off < n) {
              size_t a = (s + off) & (PG - 1), len = PG - a; if (len > n - off) len = n - off;
              got = 0;
              if (vm_read_overwrite(mach_task_self(), (vm_address_t)(s + off), (vm_size_t)len, (vm_address_t)(d + off), &got) == KERN_SUCCESS && got == len) ok += len;
              else memset(d + off, 0, len);
              off += len;
            }
            if (ok < n) { bad_reads++; ios_log("ge: texture read %p+%u: only %u bytes mapped (stale/short level?)", src, (unsigned)n, (unsigned)ok); }
            return ok;
          #else
            memcpy(dst, src, n); return n;
          #endif
          }
          """),
              (r"""typedef struct { uintptr_t p, clut; int fmt, w, h, swz, lv; unsigned chash; size_t bytes; GLuint id; int live; } TC;""",
               r"""typedef struct { uintptr_t p, clut; int fmt, w, h, swz, lv; unsigned chash; size_t bytes; GLuint id; int live; int ul; } TC;
          static int lastUl = 1;   /* levels actually uploaded for the texture tex_get() returned last */"""),
              (r"""  uint32_t cl[256]; unsigned ch = 0; uintptr_t cp = S.slot[3];""",
               r"""  if ((S.tw[0] & 15) > 9 || (S.th[0] & 15) > 9) return 0;   /* GE max is 512; a bigger value is stale/garbage state */
            uint32_t cl[256]; unsigned ch = 0; uintptr_t cp = S.slot[3];"""),
              (r"""  for (int i = 0; i < tcn; i++) if (tc[i].live && tc[i].p == p && tc[i].fmt == fmt && tc[i].w == w && tc[i].h == h && tc[i].swz == S.texSwz && tc[i].lv == lv && tc[i].clut == (fmt >= 4 ? cp : 0) && tc[i].chash == ch) return tc[i].id;""",
               r"""  for (int i = 0; i < tcn; i++) if (tc[i].live && tc[i].p == p && tc[i].fmt == fmt && tc[i].w == w && tc[i].h == h && tc[i].swz == S.texSwz && tc[i].lv == lv && tc[i].clut == (fmt >= 4 ? cp : 0) && tc[i].chash == ch) { lastUl = tc[i].ul; return tc[i].id; }"""),
              (r"""    int rowb = lw * bpp_x2(fmt) / 2; if (fmt == 4) rowb = (lw + 1) / 2; int tb = S.tbw[l] ? S.tbw[l] : lw; int stride = fmt == 4 ? tb / 2 : tb * bpp_x2(fmt) / 2; if (stride < rowb) stride = rowb;""",
               r"""    if (l > 0 && (lw != (w >> l > 0 ? w >> l : 1) || lh != (h >> l > 0 ? h >> l : 1))) { lv = l; break; }   /* levels must halve; otherwise the state is stale */
              int rowb = lw * bpp_x2(fmt) / 2; if (fmt == 4) rowb = (lw + 1) / 2; int tb = S.tbw[l] ? S.tbw[l] : lw; int stride = fmt == 4 ? tb / 2 : tb * bpp_x2(fmt) / 2; if (stride < rowb) stride = rowb;"""),
              (r"""    if (S.texSwz) { uint8_t *tmp = (uint8_t *)calloc((size_t)stride * (lh + 8), 1); unswz(tmp, (const uint8_t *)lp, stride, lh); memcpy(lin, tmp, (size_t)stride * lh); free(tmp); } else memcpy(lin, (const void *)lp, (size_t)stride * lh);
              uint32_t *o = (uint32_t *)malloc((size_t)lw * lh * 4);""",
               r"""    if (S.texSwz) {
                int rb = stride < 16 ? 16 : stride; size_t ssz = (size_t)(rb / 16) * 128 * (size_t)((lh + 7) / 8);   /* exactly what unswz() reads */
                uint8_t *sb = (uint8_t *)malloc(ssz), *tmp = (uint8_t *)calloc((size_t)stride * (lh + 8), 1);
                if (sb && tmp) { safe_copy(sb, (const void *)lp, ssz); unswz(tmp, sb, stride, lh); memcpy(lin, tmp, (size_t)stride * lh); } else memset(lin, 0, (size_t)stride * lh);
                free(sb); free(tmp);
              } else safe_copy(lin, (const void *)lp, (size_t)stride * lh);
              uint32_t *o = (uint32_t *)malloc((size_t)lw * lh * 4); if (!o) { free(lin); lv = l; break; }"""),
              (r"""  tc[slot] = (TC){ p, fmt >= 4 ? cp : 0, fmt, w, h, S.texSwz, S.texMips + 1, ch, total ? (size_t)(w * h * bpp_x2(fmt) / 2 + 64) : 64, id, 1 };
            tc[slot].lv = S.texMips + 1; (void)lv; return id;""",
               r"""  tc[slot] = (TC){ p, fmt >= 4 ? cp : 0, fmt, w, h, S.texSwz, S.texMips + 1, ch, total ? (size_t)(w * h * bpp_x2(fmt) / 2 + 64) : 64, id, 1, 1 };
            tc[slot].lv = S.texMips + 1; tc[slot].ul = lv < 1 ? 1 : lv; lastUl = tc[slot].ul; return id;"""),
              (r"""  int mip = S.texMips > 0; int mn = S.minF; GLint f;""",
               r"""  int mip = S.texMips > 0 && lastUl > 1; int mn = S.minF; GLint f;"""),
              ]
              for old, new in reps:
                  assert s.count(old) == 1, p + ": anchor not found/unique: " + old[:50]
                  s = s.replace(old, new, 1)
              open(p, "w", encoding="utf-8").write(s)
              print(p, "patched")
          PY
          grep -c safe_copy src/ge_gles2.c

      - name: Build
        working-directory: ios
        env:
          THEOS: ${{ github.workspace }}/theos
          FINALPACKAGE: "1"
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1 2>&1 | tee ../build-theos.log
          ls -la packages

      - name: Verify Mach-O (armv7, min iOS 7.0)
        working-directory: ios
        run: |
          BIN="$(find .theos -type f -name SHARArmv7 | head -n1)"
          file "$BIN" || true
          TOOLBIN="$THEOS/toolchain/linux/iphone/bin"
          OTOOL="$(ls "$TOOLBIN"/*otool* 2>/dev/null | head -n1)"
          [ -n "$OTOOL" ] && "$OTOOL" -hv -l "$BIN" | grep -E "cputype|ARM|version" | head -10 || true

      - name: Pack .ipa
        working-directory: ios
        run: |
          set -euo pipefail
          APP="$(find .theos/_ -type d -name SHARArmv7.app 2>/dev/null | head -n1 || true)"
          [ -n "$APP" ] || APP="$(find .theos -type d -name SHARArmv7.app | head -n1)"
          [ -n "$APP" ] || { echo "::error::SHARArmv7.app not found"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload packages
          cp -a "$APP" ipa/Payload/
          A=ipa/Payload/SHARArmv7.app
          # Theos does not pick Resources/Info.plist by itself -> without this the .ipa has no Info.plist and cannot be installed
          cp Resources/Info.plist "$A/Info.plist"
          cp Resources/LaunchImage*.png "$A/"
          # keys that every Xcode-built app has; some installers / sideload tools read them
          python3 - "$A/Info.plist" <<'PY'
          import plistlib, sys
          f = sys.argv[1]
          d = plistlib.load(open(f, "rb"))
          for k, v in (("CFBundleSupportedPlatforms", ["iPhoneOS"]), ("DTPlatformName", "iphoneos"), ("DTSDKName", "iphoneos9.3"),
                       ("DTPlatformVersion", "9.3"), ("CFBundleSignature", "????")):
              d.setdefault(k, v)
          plistlib.dump(d, open(f, "wb"), fmt=plistlib.FMT_XML)
          PY
          chmod 755 "$A/SHARArmv7"
          # (re)apply the fake signature with entitlements so AppSync/TrollStore-style installers accept the binary
          LDID="$(command -v ldid || true)"
          [ -n "$LDID" ] || LDID="$(ls "$THEOS"/toolchain/linux/iphone/bin/ldid "$THEOS"/bin/ldid 2>/dev/null | head -n1 || true)"
          if [ -n "$LDID" ]; then "$LDID" -SResources/entitlements.plist "$A/SHARArmv7"; else echo "::warning::ldid not found, binary left as built"; fi
          # sanity check: fail the build instead of shipping a broken .ipa
          python3 - "$A" <<'PY'
          import plistlib, os, sys
          a = sys.argv[1]
          d = plistlib.load(open(os.path.join(a, "Info.plist"), "rb"))
          for k in ("CFBundleIdentifier", "CFBundleExecutable", "CFBundleName", "CFBundleVersion", "MinimumOSVersion"):
              assert d.get(k), "Info.plist: missing " + k
          exe = os.path.join(a, d["CFBundleExecutable"])
          assert os.path.isfile(exe) and os.access(exe, os.X_OK), "executable missing: " + exe
          print("Info.plist OK:", d["CFBundleIdentifier"], d["CFBundleShortVersionString"], "min iOS", d["MinimumOSVersion"])
          PY
          file "$A/SHARArmv7" || true
          (cd ipa && zip -qry "../packages/SHAR-armv7-$(git rev-parse --short HEAD).ipa" Payload)
          unzip -l packages/SHAR-armv7-*.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: SHAR-armv7-iOS
          path: |
            ios/packages/*.ipa
            ios/packages/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-theos.log
          if-no-files-found: ignore
