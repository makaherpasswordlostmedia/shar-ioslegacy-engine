          +static void quadz(uint32_t col, float x0, float y0, float x1, float y1, float z) {
          +  V3 *v = (V3 *)sceGuGetMemory(6 * sizeof(V3));
          +  V3 q[6] = { { col, x0, y0, z }, { col, x1, y0, z }, { col, x1, y1, z }, { col, x0, y0, z }, { col, x1, y1, z }, { col, x0, y1, z } }; memcpy(v, q, sizeof q);
