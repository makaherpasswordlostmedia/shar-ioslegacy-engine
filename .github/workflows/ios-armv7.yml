          +  if (gp) d = gp(0x31DD /* EGL_PLATFORM_SURFACELESS_MESA */, EGL_DEFAULT_DISPLAY, 0); if (d == EGL_NO_DISPLAY) d = eglGetDisplay(EGL_DEFAULT_DISPLAY);
          +  EGLint maj, min; if (!eglInitialize(d, &maj, &min)) { fprintf(stderr, "eglInitialize failed\n"); return 2; }
          +  eglBindAPI(EGL_OPENGL_ES_API);
          +  EGLint ca[] = { EGL_SURFACE_TYPE, EGL_PBUFFER_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT, EGL_RED_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_BLUE_SIZE, 8, EGL_ALPHA_SIZE, 8, EGL_DEPTH_SIZE, 16, EGL_NONE };
          +  EGLConfig cfg; EGLint nc; if (!eglChooseConfig(d, ca, &cfg, 1, &nc) || !nc) { fprintf(stderr, "no EGL config\n"); return 2; }
          +  EGLint pa[] = { EGL_WIDTH, 480, EGL_HEIGHT, 272, EGL_NONE }; EGLSurface sf = eglCreatePbufferSurface(d, cfg, pa);
          +  EGLint xa[] = { EGL_CONTEXT_CLIENT_VERSION, 2, EGL_NONE }; EGLContext cx = eglCreateContext(d, cfg, EGL_NO_CONTEXT, xa);
          +  if (!eglMakeCurrent(d, sf, sf, cx)) { fprintf(stderr, "eglMakeCurrent failed\n"); return 2; }
          +  printf("GL: %s | %s\n", (const char *)glGetString(GL_RENDERER), (const char *)glGetString(GL_VERSION));
          +  list = (uint32_t *)low(1 << 18); sceGuInit();
          +
          +  puts("-- scene 1: depth order (near red drawn FIRST, far blue drawn after; GEQUAL, range 65535..0)");
          +  frame_begin(); camera(0, 2, 10, 0, 2, 0);
          +  quadz(RED, -1, 1, 1, 3, 2.f); quadz(BLUE, -8, -4, 8, 10, -20.f); frame_end();
          +  expect("centre = near red quad", 240, 136, 255, 0, 0, 3);
          +  expect("left of red = far blue quad", 190, 136, 0, 0, 255, 3);
          +  expect("outside everything = clear colour", 20, 20, 48, 48, 48, 3);
          +  puts("-- scene 2: far blue drawn FIRST, near red after");
          +  frame_begin(); camera(0, 2, 10, 0, 2, 0);
          +  quadz(BLUE, -8, -4, 8, 10, -20.f); quadz(RED, -1, 1, 1, 3, 2.f); frame_end();
          +  expect("centre = near red quad", 240, 136, 255, 0, 0, 3);
          +  expect("left of red = far blue quad", 190, 136, 0, 0, 255, 3);
          +
          +  puts("-- scene 3: camera translation (eye x=3): red quad must move LEFT on screen");
          +  frame_begin(); camera(3, 2, 10, 3, 2, 0); quadz(RED, -1, 1, 1, 3, 2.f); frame_end();
          +  expect("red at shifted position", 152, 136, 255, 0, 0, 3);
          +  expect("old centre is empty now", 240, 136, 48, 48, 48, 3);
          +  puts("-- scene 4: camera behind / world translation (model matrix translate z -30 with eye z=10)");
          +  frame_begin(); camera(0, 2, 10, 0, 2, 0); { ScePspFVector3 t = { 0, 0, -30 }; sceGumTranslate(&t); } quadz(GREEN, -4, 0, 4, 4, 0); frame_end();
          +  expect("translated quad visible at centre", 240, 130, 0, 255, 0, 3);
          +
          +  puts("-- scene 5: scissor uses END corner (libgu quirk): sceGuScissor(120,68,360,204)");
          +  frame_begin(); sceGuScissor(120, 68, 360, 204); rect2d(RED, 0, 0, 480, 272); frame_end();
          +  expect("inside (130,80)", 130, 80, 255, 0, 0, 3);
          +  expect("inside (350,200)", 350, 200, 255, 0, 0, 3);
          +  expect("outside right (370,100)", 370, 100, 48, 48, 48, 3);
          +  expect("outside left (100,100)", 100, 100, 48, 48, 48, 3);
          +
          +  puts("-- scene 6: 2D sprites (through mode) and alpha blend");
          +  frame_begin(); rect2d(GREEN, 10, 10, 100, 60); sceGuEnable(GU_BLEND); sceGuBlendFunc(GU_ADD, GU_SRC_ALPHA, GU_ONE_MINUS_SRC_ALPHA, 0, 0); rect2d(0x800000ffu, 50, 30, 150, 90); frame_end();
          +  expect("opaque green sprite", 20, 20, 0, 255, 0, 3);
          +  expect("half red over green", 70, 40, 127, 127, 0, 4);
          +  expect("half red over clear", 120, 80, 151, 24, 24, 4);
          +
          +  puts("-- scene 7: textured quad with INCOMPLETE mip chain (32x32 + 16x16 only) minified 8x");
          +  uint32_t *t0 = (uint32_t *)low(4096), *t1 = (uint32_t *)low(4096); for (int i = 0; i < 32 * 32; i++) t0[i] = 0xff00ffffu; for (int i = 0; i < 16 * 16; i++) t1[i] = 0xffffff00u;   /* yellow / cyan (ABGR) */
          +  frame_begin(); sceGuEnable(GU_TEXTURE_2D); sceGuTexMode(GU_PSM_8888, 1, 0, 0); sceGuTexImage(0, 32, 32, 32, t0); sceGuTexImage(1, 16, 16, 16, t1);
          +  sceGuTexFunc(GU_TFX_REPLACE, GU_TCC_RGBA); sceGuTexFilter(GU_LINEAR_MIPMAP_NEAREST, GU_LINEAR); sceGuTexWrap(GU_CLAMP, GU_CLAMP);
          +  { VT *v = (VT *)sceGuGetMemory(2 * sizeof(VT)); v[0] = (VT){ 0, 0, 0xffffffffu, 100, 100, 0 }; v[1] = (VT){ 1, 1, 0xffffffffu, 132, 132, 0 };   /* 1:1 -> level 0 */
          +    sceGuDrawArray(GU_SPRITES, GU_TEXTURE_32BITF | GU_COLOR_8888 | GU_VERTEX_32BITF | GU_TRANSFORM_2D, 2, 0, v); }
          +  { VT *v = (VT *)sceGuGetMemory(2 * sizeof(VT)); v[0] = (VT){ 0, 0, 0xffffffffu, 200, 100, 0 }; v[1] = (VT){ 1, 1, 0xffffffffu, 204, 104, 0 };   /* 8x minified -> tail of the chain */
          +    sceGuDrawArray(GU_SPRITES, GU_TEXTURE_32BITF | GU_COLOR_8888 | GU_VERTEX_32BITF | GU_TRANSFORM_2D, 2, 0, v); }
          +  frame_end();
          +  expect("level 0 (yellow)", 116, 116, 255, 255, 0, 3);
          +  expect_not("minified level is NOT black", 202, 102, 0, 0, 0, 8);
          +
          +  printf("\n%d/%d checks passed\n", checks - fails, checks);
          +  return fails ? 1 : 0;
          +}
          diff --git a/b/tests/ios_ge/run.sh b/tests/ios_ge/run.sh
          new file mode 100755
          index 0000000..d7a71a9
          --- /dev/null
          +++ b/tests/ios_ge/run.sh
          @@ -0,0 +1,6 @@
          +#!/usr/bin/env bash
          +# Usage: tests/ios_ge/run.sh [ios_dir]   (default: <repo>/ios).  Needs libgles2-mesa-dev + libegl1-mesa-dev (Mesa llvmpipe runs it headless).
          +set -e
          +HERE="$(cd "$(dirname "$0")" && pwd)"; IOS="${1:-$HERE/../../ios}"; OUT="${TMPDIR:-/tmp}/ge_render_test"
          +gcc -std=gnu11 -O1 -g -w -I"$IOS/shim" -o "$OUT" "$HERE/ge_render_test.c" "$IOS/src/ge_list.c" "$IOS/src/ge_gles2.c" -lEGL -lGLESv2 -lm -lpthread
          +LIBGL_ALWAYS_SOFTWARE=1 "$OUT"

          FIXES_PATCH_EOF
          grep -c '^diff --git' fixes.patch
      - uses: actions/upload-artifact@v4
        with:
          name: fixes-patch
          path: fixes.patch

  host-check:
    name: Render test + engine compiles against the PSP shim (x86_64)
    needs: prepare-fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fixes-patch
      - name: Apply fixes.patch (idempotent)
        run: |
          set -e
          if git apply --check fixes.patch 2>/dev/null; then git apply --whitespace=nowarn fixes.patch; echo "fixes applied";
          elif git apply --check -R fixes.patch 2>/dev/null; then echo "fixes already in the tree";
          else echo "::error::fixes.patch does not apply to this tree"; git apply --check fixes.patch; exit 1; fi
          chmod +x tests/ios_ge/run.sh
      - name: Render test (GE -> GLES2 on headless Mesa)
        run: |
          sudo apt-get update && sudo apt-get install -y libgles2-mesa-dev libegl1-mesa-dev libegl-mesa0 libgl1-mesa-dri
          tests/ios_ge/run.sh
      - name: Syntax-check engine + shim
        working-directory: viewer
        run: |
          set -e
          CF="-I../ios/shim -I. -std=gnu11 -fsyntax-only -w -include msio.h -include geguard.h -Dmain=shar_main"
          SRC=$(grep -o 'add_executable(sharview [^)]*' CMakeLists.txt | sed 's/add_executable(sharview //')
          for f in $SRC fxdsp.c collectfx.c camsafe.c; do
            # savemenu.c has a sizeof()==1536 assert that only holds for 32-bit pointers
            [ "$f" = savemenu.c ] && continue
            gcc $CF "$f" || { echo "::error::$f"; exit 1; }
          done
          for f in ../ios/src/ge_list.c ../ios/src/psp_sys.c ../ios/src/me_stub.c; do gcc -fsyntax-only -w -I../ios/shim "$f"; done

  build-ios-armv7:
    name: iOS armv7 (Theos, iOS 7.0 - 9.3.5)
    needs: [prepare-fixes, host-check]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fixes-patch
      - name: Apply fixes.patch (idempotent)
        run: |
          set -e
          if git apply --check fixes.patch 2>/dev/null; then git apply --whitespace=nowarn fixes.patch; echo "fixes applied";
          elif git apply --check -R fixes.patch 2>/dev/null; then echo "fixes already in the tree";
          else echo "::error::fixes.patch does not apply to this tree"; git apply --check fixes.patch; exit 1; fi
          chmod +x tests/ios_ge/run.sh

      - name: Culling experiment (workflow_dispatch input "cull"; push builds stay "normal")
        env:
          CULL: ${{ inputs.cull }}
        run: |
          set -e
          f=ios/src/ge_gles2.c
          case "${CULL:-normal}" in
            off)     sed -i 's/if (S.en\[EN_CULL\] \&\& !thr)/if (0 \&\& S.en[EN_CULL] \&\& !thr)/' $f ;;
            flipped) sed -i 's/glFrontFace(S.cullFront ? GL_CW : GL_CCW)/glFrontFace(S.cullFront ? GL_CCW : GL_CW)/' $f ;;
          esac
          echo "cull mode: ${CULL:-normal}"; grep -n "glFrontFace\|EN_CULL\] &&" $f | head

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl curl ca-certificates zip unzip xz-utils bzip2 git fakeroot make

      - name: Install Theos + iOS toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iPhoneOS 9.3 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/iphoneos9.3.sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/iphoneos9.3.sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done

      - name: Patch ios/Makefile (idempotent; keeps all packaging fixes inside this workflow)
        working-directory: ios
        run: |
          set -euo pipefail
          # ios_host.m is written for ARC; the per-file key in the Makefile does not match paths in FILES
          grep -q 'SHARArmv7_OBJCFLAGS' Makefile || printf '\nSHARArmv7_OBJCFLAGS += -fobjc-arc\n' >> Makefile
          # Theos only picks ./Info.plist, not Resources/Info.plist -> copy it (and launch images) into the staged .app; postinst must be executable
          if ! grep -q '^internal-stage::' Makefile; then
            printf '\ninternal-stage::\n\t$(ECHO_NOTHING)mkdir -p $(THEOS_STAGING_DIR)/Applications/$(APPLICATION_NAME).app && cp Resources/Info.plist Resources/LaunchImage*.png $(THEOS_STAGING_DIR)/Applications/$(APPLICATION_NAME).app/$(ECHO_END)\n\t$(ECHO_NOTHING)chmod 755 $(THEOS_STAGING_DIR)/DEBIAN/postinst 2>/dev/null || true$(ECHO_END)\n' >> Makefile
          fi
          tail -8 Makefile

      - name: Add .deb postinst (creates the game data folder on install)
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p layout/DEBIAN
          cat > layout/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          # Runs after the .deb is installed (Cydia / Sileo / Zebra / dpkg -i).
          # Creates the folder where the converted game data must be copied.
          # Must stay in sync with ios_host.m: apps in /Applications use /var/mobile/Documents.
          case "$1" in
            configure|"") ;;
            *) exit 0 ;;
          esac
          GAME_DIR="/var/mobile/Documents/SHARVIEW"
          mkdir -p "$GAME_DIR"
          chown mobile:mobile /var/mobile/Documents "$GAME_DIR" 2>/dev/null
          chmod 755 "$GAME_DIR"
          if [ ! -f "$GAME_DIR/PUT_GAME_DATA_HERE.txt" ]; then
            printf '%s\n' \
              "Put the converted game data (made from your own disc) into THIS folder:" \
              "  /var/mobile/Documents/SHARVIEW" \
              "Copy with Filza, scp/sftp or iFunBox, then restart the game." \
              "Log: /var/mobile/Documents/shar_ios.log" > "$GAME_DIR/PUT_GAME_DATA_HERE.txt"
            chown mobile:mobile "$GAME_DIR/PUT_GAME_DATA_HERE.txt" 2>/dev/null
          fi
          command -v uicache >/dev/null 2>&1 && uicache >/dev/null 2>&1
          echo "SHAR: game data folder ready -> $GAME_DIR"
          exit 0
          EOF
          chmod 755 layout/DEBIAN/postinst
          sh -n layout/DEBIAN/postinst

      - name: Build
        working-directory: ios
        env:
          THEOS: ${{ github.workspace }}/theos
          FINALPACKAGE: "1"
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1 2>&1 | tee ../build-theos.log
          ls -la packages

      - name: Verify Mach-O (armv7, min iOS 7.0)
        working-directory: ios
        run: |
          BIN="$(find .theos -type f -name SHARArmv7 | head -n1)"
          file "$BIN" || true
          TOOLBIN="$THEOS/toolchain/linux/iphone/bin"
          OTOOL="$(ls "$TOOLBIN"/*otool* 2>/dev/null | head -n1)"
          [ -n "$OTOOL" ] && "$OTOOL" -hv -l "$BIN" | grep -E "cputype|ARM|version" | head -10 || true

      - name: Pack .ipa
        working-directory: ios
        run: |
          set -euo pipefail
          APP="$(find .theos/_ -type d -name SHARArmv7.app 2>/dev/null | head -n1 || true)"
          [ -n "$APP" ] || APP="$(find .theos -type d -name SHARArmv7.app | head -n1)"
          [ -n "$APP" ] || { echo "::error::SHARArmv7.app not found"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload packages
          cp -a "$APP" ipa/Payload/
          A=ipa/Payload/SHARArmv7.app
          # Theos does not pick Resources/Info.plist by itself -> without this the .ipa has no Info.plist and cannot be installed
          cp Resources/Info.plist "$A/Info.plist"
          cp Resources/LaunchImage*.png "$A/"
          # keys that every Xcode-built app has; some installers / sideload tools read them
          python3 - "$A/Info.plist" <<'PY'
          import plistlib, sys
          f = sys.argv[1]
          d = plistlib.load(open(f, "rb"))
          for k, v in (("CFBundleSupportedPlatforms", ["iPhoneOS"]), ("DTPlatformName", "iphoneos"), ("DTSDKName", "iphoneos9.3"),
                       ("DTPlatformVersion", "9.3"), ("CFBundleSignature", "????")):
              d.setdefault(k, v)
          plistlib.dump(d, open(f, "wb"), fmt=plistlib.FMT_XML)
          PY
          chmod 755 "$A/SHARArmv7"
          # (re)apply the fake signature with entitlements so AppSync/TrollStore-style installers accept the binary
          LDID="$(command -v ldid || true)"
          [ -n "$LDID" ] || LDID="$(ls "$THEOS"/toolchain/linux/iphone/bin/ldid "$THEOS"/bin/ldid 2>/dev/null | head -n1 || true)"
          if [ -n "$LDID" ]; then "$LDID" -SResources/entitlements.plist "$A/SHARArmv7"; else echo "::warning::ldid not found, binary left as built"; fi
          # sanity check: fail the build instead of shipping a broken .ipa
          python3 - "$A" <<'PY'
          import plistlib, os, sys
          a = sys.argv[1]
          d = plistlib.load(open(os.path.join(a, "Info.plist"), "rb"))
          for k in ("CFBundleIdentifier", "CFBundleExecutable", "CFBundleName", "CFBundleVersion", "MinimumOSVersion"):
              assert d.get(k), "Info.plist: missing " + k
          exe = os.path.join(a, d["CFBundleExecutable"])
          assert os.path.isfile(exe) and os.access(exe, os.X_OK), "executable missing: " + exe
          print("Info.plist OK:", d["CFBundleIdentifier"], d["CFBundleShortVersionString"], "min iOS", d["MinimumOSVersion"])
          PY
          file "$A/SHARArmv7" || true
          (cd ipa && zip -qry "../packages/SHAR-armv7-$(git rev-parse --short HEAD).ipa" Payload)
          unzip -l packages/SHAR-armv7-*.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: SHAR-armv7-iOS
          path: |
            ios/packages/*.ipa
            ios/packages/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-theos.log
          if-no-files-found: ignore
