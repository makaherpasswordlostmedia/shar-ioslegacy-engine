<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Типографика SHAR</title>
<link rel="icon" href="data:,">
<style>
/* house:tokens begin · правится только _arsenal/house/house.tokens.css, вписывается stamp_house.py */
:root{
  --nh:80;--brand-hue:182;
  --bg:#f6f5f2;--side:rgba(246,245,242,.86);--card:#ecebe6;--field:#ffffff;--stage:#ffffff;
  --ink:#1a1a1a;--ink2:#3d3c39;--ink3:#5c5b57;--on-ink:#ffffff;--on-ink-muted:rgba(255,255,255,.72);--knob:#ffffff;
  --fill:rgba(26,26,26,.07);--fill-hover:rgba(26,26,26,.10);--fill-strong:rgba(26,26,26,.15);--fill-active:rgba(26,26,26,.24);--line-strong:rgba(26,26,26,.28);
  --line:rgba(26,26,26,.14);--line-ctl:rgba(26,26,26,.28);--hair:rgba(26,26,26,.10);--hover:rgba(26,26,26,.055);
  --sel:oklch(.49 .08 var(--brand-hue));--selfg:#ffffff;--ring:oklch(.49 .08 var(--brand-hue));--seg-on:#ffffff;--track-s:.02em;
  --m-wait:oklch(.76 .12 78);--m-work:oklch(.52 .085 var(--brand-hue));--m-pause:#b9b8b2;--m-done:#d9d8d2;
  --st-ok:oklch(.6 .09 145);--st-run:oklch(.55 .09 var(--brand-hue));--st-wait:oklch(.74 .13 75);--st-bad:oklch(.56 .15 40);--st-sched:oklch(.6 .05 230);--st-info:oklch(.66 .07 205);
  --t-bad:oklch(.52 .12 45);--t-wait:oklch(.5 .09 70);--on-wait:oklch(.26 .05 75);
  --scrim:rgba(20,20,20,.36);--shadow:rgba(20,20,20,.28);--shadow-s:rgba(20,20,20,.10);
  --bt:.24;--btc:.03;
  --ground-light:#ffffff;--ground-light-muted:rgba(0,0,0,.55);--ground-dark:#141414;--ground-dark-muted:rgba(255,255,255,.62);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --display:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --t1:11.67px;--t2:14px;--t3:16.8px;--t4:20.16px;--t5:24.19px;--t6:29.03px;--t7:34.84px;--t8:41.8px;
  --r-ctl:4px;--r:6px;--r-card:6px;--r-pill:999px;--ease:cubic-bezier(.23,1,.32,1);--dur-press:140ms;--dur-pop:180ms;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161615;--side:rgba(22,22,21,.86);--card:#21211f;--field:#2b2b29;--stage:#2b2b29;
  --ink:#ecebe6;--ink2:#cfcec8;--ink3:#a6a59f;--on-ink:#161615;--on-ink-muted:rgba(22,22,21,.68);--knob:#ecebe6;
  --fill:rgba(255,255,255,.07);--fill-hover:rgba(255,255,255,.10);--fill-strong:rgba(255,255,255,.16);--fill-active:rgba(255,255,255,.26);--line-strong:rgba(255,255,255,.30);
  --line:rgba(255,255,255,.14);--line-ctl:rgba(255,255,255,.30);--hair:rgba(255,255,255,.10);--hover:rgba(255,255,255,.06);
  --sel:oklch(.78 .09 var(--brand-hue));--selfg:#161615;--ring:oklch(.78 .09 var(--brand-hue) / .7);--seg-on:#3d3d3a;--track-s:.025em;
  --m-wait:oklch(.78 .12 78);--m-work:oklch(.74 .09 var(--brand-hue));--m-pause:#5d5c57;--m-done:#3b3b38;
  --st-ok:oklch(.76 .08 145);--st-run:oklch(.78 .09 var(--brand-hue));--st-wait:oklch(.8 .12 78);--st-bad:oklch(.72 .13 45);--st-sched:oklch(.72 .05 230);--st-info:oklch(.76 .07 205);
  --t-bad:oklch(.74 .11 50);--t-wait:oklch(.82 .1 78);--on-wait:oklch(.22 .04 75);
  --scrim:rgba(0,0,0,.55);--shadow:rgba(0,0,0,.5);--shadow-s:rgba(0,0,0,.3);
  --bt:.95;--btc:.012;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161615;--side:rgba(22,22,21,.86);--card:#21211f;--field:#2b2b29;--stage:#2b2b29;
  --ink:#ecebe6;--ink2:#cfcec8;--ink3:#a6a59f;--on-ink:#161615;--on-ink-muted:rgba(22,22,21,.68);--knob:#ecebe6;
  --fill:rgba(255,255,255,.07);--fill-hover:rgba(255,255,255,.10);--fill-strong:rgba(255,255,255,.16);--fill-active:rgba(255,255,255,.26);--line-strong:rgba(255,255,255,.30);
  --line:rgba(255,255,255,.14);--line-ctl:rgba(255,255,255,.30);--hair:rgba(255,255,255,.10);--hover:rgba(255,255,255,.06);
  --sel:oklch(.78 .09 var(--brand-hue));--selfg:#161615;--ring:oklch(.78 .09 var(--brand-hue) / .7);--seg-on:#3d3d3a;--track-s:.025em;
  --m-wait:oklch(.78 .12 78);--m-work:oklch(.74 .09 var(--brand-hue));--m-pause:#5d5c57;--m-done:#3b3b38;
  --st-ok:oklch(.76 .08 145);--st-run:oklch(.78 .09 var(--brand-hue));--st-wait:oklch(.8 .12 78);--st-bad:oklch(.72 .13 45);--st-sched:oklch(.72 .05 230);--st-info:oklch(.76 .07 205);
  --t-bad:oklch(.74 .11 50);--t-wait:oklch(.82 .1 78);--on-wait:oklch(.22 .04 75);
  --scrim:rgba(0,0,0,.55);--shadow:rgba(0,0,0,.5);--shadow-s:rgba(0,0,0,.3);
  --bt:.95;--btc:.012;color-scheme:dark}
/* house:tokens end */
/* Твик-панель типографики SHAR PSP (правка Роба 312). Тёмная тема: цвета игры читаются честно на нейтральном тёмном. Панель v2 по SVEN
   (_arsenal/podacha/kit): ряд «подпись · контрол», число — скраб-полоса, клик — ввод, Shift — шаг ×0,1, стрелки ±шаг */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t2)/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-height:56px;padding:8px 24px;background:var(--side);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 1px 0 var(--hair)}
.who{display:flex;flex-direction:column;min-width:0;margin-right:8px}
.who b{font:600 var(--t3)/1.2 var(--display);white-space:nowrap}
.who span{font-size:var(--t1);letter-spacing:var(--track-s);color:var(--ink3);white-space:nowrap}
.grow{flex:1}
.btn{appearance:none;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--r);height:32px;padding:0 14px;font:500 var(--t2)/1 var(--sans);color:var(--ink);background:var(--fill);white-space:nowrap;transition:background-color var(--dur-pop) var(--ease),transform var(--dur-press) var(--ease)}
.btn.ghost{background:transparent;color:var(--ink3)}
.btn.small{height:26px;padding:0 10px;font-size:var(--t1)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--on-ink)}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--fill-strong)}.btn.pri:hover{background:var(--ink);opacity:.88}.btn.ghost:hover{background:var(--fill);color:var(--ink)}}
.idx{display:flex;gap:6px;overflow-x:auto;padding:12px 24px 4px;scrollbar-width:none}
.idx::-webkit-scrollbar{display:none}
.idx button{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border:0;border-radius:var(--r-pill);background:var(--fill);color:var(--ink2);font-weight:500;white-space:nowrap;transition:background-color var(--dur-pop) var(--ease),color var(--dur-pop) var(--ease)}
.idx button[aria-current="true"]{background:var(--fill-active);color:var(--ink)}
.idx .dot{width:6px;height:6px;border-radius:50%;background:var(--sel)}
@media (hover:hover) and (pointer:fine){.idx button:hover{background:var(--fill-strong);color:var(--ink)}}
.sk{font:500 var(--t1)/1 var(--mono);letter-spacing:.02em;color:var(--ink3);font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:minmax(0,auto) minmax(360px,1fr);gap:28px;align-items:start;padding:16px 24px 80px;max-width:1720px}
.stagecol{min-width:0;position:sticky;top:76px}
.screen{position:relative;display:block;width:calc(480px * var(--z));height:calc(272px * var(--z));background:#000;border-radius:2px;overflow:hidden}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:10px 0 0;color:var(--ink3);font-size:var(--t1);letter-spacing:var(--track-s)}
.meta b{font:600 var(--t4)/1.2 var(--display);color:var(--ink);letter-spacing:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:14px 0 0}
.ctl .lab{color:var(--ink3);font-size:var(--t1);letter-spacing:var(--track-s)}
.seg{display:inline-flex;gap:2px;background:var(--fill);border-radius:var(--r-pill);padding:2px;height:28px}
.seg button{border:0;border-radius:var(--r-pill);background:transparent;font:500 var(--t1)/1 var(--sans);letter-spacing:var(--track-s);color:var(--ink3);padding:0 10px;white-space:nowrap;transition:background-color var(--dur-pop) var(--ease),color var(--dur-pop) var(--ease)}
.seg button[aria-checked="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 1px var(--shadow-s)}
.sw{position:relative;appearance:none;width:40px;height:24px;border-radius:var(--r-pill);border:0;padding:0;background:var(--fill-strong);transition:background-color var(--dur-pop) var(--ease);flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--knob);box-shadow:0 1px 1px var(--shadow-s);transition:transform var(--dur-pop) var(--ease)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(16px);background:var(--on-ink)}
.swl{display:inline-flex;align-items:center;gap:8px;color:var(--ink3);font-size:var(--t1);letter-spacing:var(--track-s)}
.sum{margin:22px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.sum h3{margin:0 0 4px;font:600 var(--t4)/1.2 var(--display)}
.sum p{margin:0 0 10px;color:var(--ink3);font-size:var(--t1);letter-spacing:var(--track-s)}
.sumt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0 14px;padding:4px 10px;border-radius:var(--r-card);background:var(--card);font-size:var(--t1)}
.sumt div{padding:5px 0;border-top:1px solid var(--hair);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumt div:nth-child(-n+3){border-top:0;color:var(--ink3);letter-spacing:var(--track-s)}
.sumt .n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.sumt .low{color:var(--t-wait)}
.sumt button{all:unset;cursor:pointer}
.sumt button:hover{text-decoration:underline}
.side{min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.card{margin:0 0 12px;padding:12px 14px 14px;border-radius:var(--r-card);background:var(--card);transition:box-shadow var(--dur-pop) var(--ease)}
.card.on{box-shadow:inset 0 0 0 1px var(--ring)}
.ch{display:flex;align-items:baseline;gap:8px;margin:0 0 2px}
.ch b{font:600 var(--t3)/1.25 var(--display);cursor:pointer}
.ch .chg{width:7px;height:7px;border-radius:50%;background:var(--sel);align-self:center;flex:none}
.ch .grow{flex:1}
.why{margin:0 0 10px;color:var(--ink3);font-size:var(--t1);letter-spacing:var(--track-s)}
.stat{margin:8px 0 0;color:var(--ink3);font:400 var(--t1)/1.4 var(--mono);font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);align-items:center;gap:8px;min-height:28px}
.lab{display:block;font:400 var(--t1)/1.2 var(--sans);color:var(--ink3);letter-spacing:var(--track-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{display:inline-grid;place-items:center;vertical-align:-3px;margin-left:6px;width:16px;height:16px;padding:0;border:0;border-radius:50%;background:var(--fill-strong);color:var(--ink);font:600 var(--t1)/1 var(--sans);cursor:help}
.hint{grid-column:1/-1;margin:2px 0 4px;font-size:var(--t1);letter-spacing:var(--track-s);color:var(--ink3)}
.scrub{position:relative;height:26px;border-radius:var(--r-ctl);background:var(--fill);overflow:hidden;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:background-color var(--dur-pop) var(--ease)}
.scrub .fill{position:absolute;inset:0;background:var(--fill-strong);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.scrub .mark{position:absolute;top:3px;bottom:3px;width:1px;background:var(--line-strong);pointer-events:none}
.scrub.active .fill{background:var(--fill-active)}
.scrub .sval{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;background:transparent;padding:0 8px;text-align:right;font:500 var(--t1)/26px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);-webkit-text-fill-color:var(--ink);pointer-events:none;outline:none}
.scrub.editing{background:var(--field);box-shadow:inset 0 0 0 1px var(--line-strong);cursor:text}
.scrub.editing .fill,.scrub.editing .mark{opacity:0}
.scrub.editing .sval{text-align:left}
.tin{height:26px;width:100%;min-width:0;border-radius:var(--r-ctl);border:1px solid var(--line-strong);background:var(--field);font:500 var(--t1) var(--sans);letter-spacing:var(--track-s);padding:0 6px;color:var(--ink)}
.cg{margin:18px 0 8px;font:500 var(--t1)/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.note{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line);color:var(--ink3);font-size:var(--t1);letter-spacing:var(--track-s);max-width:72ch}
.note code{font-family:var(--mono);color:var(--ink2)}
textarea.json{width:100%;height:160px;margin:10px 0 0;border-radius:var(--r-ctl);border:1px solid var(--line-strong);background:var(--field);font:400 var(--t1)/1.4 var(--mono);color:var(--ink);padding:8px}
.toast{position:fixed;left:50%;bottom:20px;z-index:50;max-width:calc(100% - 32px);padding:10px 14px;border-radius:var(--r);background:var(--ink);color:var(--on-ink);font-weight:500;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity var(--dur-pop) var(--ease),transform 300ms var(--ease);box-shadow:0 8px 24px var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (hover:hover) and (pointer:fine){.scrub:hover{background:var(--fill-hover)}.seg button:hover{color:var(--ink)}}
@media (max-width:1180px){.main{grid-template-columns:minmax(0,1fr)}.stagecol{position:static}}
@media (max-width:760px){.bar{padding:8px 16px}.idx{padding:10px 16px 2px}.main{padding:12px 16px 64px}.screen{width:100%;height:auto;aspect-ratio:480/272}}
@media (pointer:coarse){.btn{min-height:44px}.row{min-height:44px}.scrub,.tin{height:44px}.scrub .sval{line-height:44px;font-size:var(--t3)}.idx button{min-height:44px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.screen{outline:none}.screen:focus-visible{box-shadow:0 0 0 2px var(--ring)}
.meas{margin:10px 0 0;padding:8px 12px;border-radius:var(--r);background:var(--card);font:400 var(--t1)/1.5 var(--mono);color:var(--ink2);min-height:22px;display:grid;gap:2px}
.meas b{font-weight:600;color:var(--ink)}
.meas .gp{color:#f24822}
.notes{margin:14px 0 0;padding:12px 14px;border-radius:var(--r-card);background:var(--card);display:grid;gap:8px}
.notes h3{margin:0;font:600 var(--t2)/1.3 var(--sans)}
.notes .selinfo{font:400 var(--t1)/1.4 var(--mono);color:var(--ink3);min-height:18px}
.notes textarea{width:100%;min-height:54px;resize:vertical;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--field);color:var(--ink);font:400 var(--t2)/1.4 var(--sans);padding:8px 10px;box-sizing:border-box}
.notes .nrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notes ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font:400 var(--t1)/1.35 var(--sans)}
.notes li{display:flex;gap:8px;align-items:flex-start}.notes li span{flex:1}.notes li button{flex:none}
.nmodal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.nmodal[hidden]{display:none}
.nmodal .box{width:min(820px,100%);max-height:86vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:var(--r-card);padding:16px 18px;display:grid;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.nmodal ol{margin:0;padding-left:22px;display:grid;gap:8px;font:400 var(--t2)/1.4 var(--sans)}
.nmodal ol small{display:block;color:var(--ink3);font:400 var(--t1)/1.3 var(--mono)}
</style>
</head>
<body>
<header class="bar">
  <div class="who"><b>Типографика SHAR · PSP 480×272</b><span id="built"></span></div>
  <div class="grow"></div>
  <button class="btn ghost" id="bOriginal" title="исходная раскладка без настроек JSON">Сброс к оригиналу</button>
  <button class="btn ghost" id="bReset" title="все группы — как в игре сейчас">Как в игре</button>
  <button class="btn" id="bTaste" title="единая шкала кеглей по ролям (заголовки 18, названия и пункты 14, подписи 11 px) поверх ваших значений; ещё раз — вернуть">Предложение вкуса 11.10</button>
  <button class="btn" id="bProp" title="правки 310 и 311: штраф и мелкие места крупнее на несколько пикселей">Предложение 310/311</button>
  <button class="btn" id="bNotes" title="все замечания по всем экранам одним списком">Все замечания</button>
  <button class="btn" id="bCopy" title="настройки текстом — прислать в чат">Скопировать JSON</button>
  <button class="btn pri" id="bSave" title="сохранить настройки в build/ui_typo.json через локальный мост">Сохранить ui_typo.json</button>
  <button class="btn ghost" id="bLoad" title="продолжить с сохранённого файла">Загрузить…</button>
  <input type="file" id="fLoad" accept=".json,application/json" hidden>
  <span id="saveState" role="status" aria-live="polite">Настройки ещё не сохранены</span>
</header>
<nav class="idx" id="scenes" aria-label="Экраны"></nav>
<main class="main">
  <section class="stagecol">
    <div class="screen" id="screen" style="--z:2" tabindex="0" aria-label="Экран PSP: клик выбирает элемент, перетаскивание и стрелки двигают его группу">
      <canvas id="cv" width="480" height="272"></canvas>
      <canvas id="ov" width="960" height="544"></canvas>
    </div>
    <div class="meta"><b id="stitle"></b><span id="snote"></span></div>
    <div class="ctl">
      <span class="lab">Масштаб</span><span class="seg" id="zoom" role="radiogroup" aria-label="Масштаб экрана"></span>
      <span class="lab">Показать</span><span class="seg" id="view" role="radiogroup" aria-label="Что на экране"></span>
      <label class="swl"><button class="sw" id="tStatic" role="switch" aria-checked="true"></button>статичные элементы</label>
      <label class="swl"><button class="sw" id="tBoxes" role="switch" aria-checked="false"></button>рамки строк</label>
      <label class="swl"><button class="sw" id="tMeas" role="switch" aria-checked="true"></button>измерения</label>
    </div>
    <div class="meas" id="meas" aria-live="polite"></div>
    <div class="notes" id="notes"></div>
    <div class="sum">
      <h3>Размеры текста по всем экранам</h3>
      <p>заглавная H и шаг строки в пикселях PSP; жёлтым — мельче 8 px (правка 311: нигде не мелко). Клик — к группе</p>
      <div class="sumt" id="sumt"></div>
    </div>
  </section>

  if (!LAST) return null; var M = LAST.M, best = null, sc = LAST.sc;
  function consider(kind, gid, name, label, r, idx, page) { if (!r || x < r[0] - 1 || x > r[0] + r[2] + 1 || y < r[1] - 1 || y > r[1] + r[3] + 1) return;
    var a = r[2] * r[3]; if (!best || a < best.a) best = {kind: kind, gid: gid || null, name: name || '', label: label || name || '', key: elKey(sc, kind, name || '', page), rect: [r[0], r[1], r[2], r[3]], idx: idx, a: a}; }
  Object.keys(LAST.info).forEach(function (g) { var refs = LAST.info[g].refs || [];

  M.stat.forEach(function (st, k) { if (st.show !== 0 && st.show !== false && st.cur) consider(st.flat ? 'rect' : 'stat', st.group, st.name || 'картинка', st.name || 'картинка', st.cur, k, st.page); });

  var shown = (sc.show || []).concat(['ALWAYS']);
  (sc.fit || []).forEach(function (b, k) {   // остальные узлы пакета на экране (рамки, плашки, запечённые в кадр картинки): выбор и замечания; сдвиг у них только через группу (нет группы)
    if (known[b[2]] || (b[0] !== 0 && b[0] !== 2) || shown.indexOf(b[1]) < 0 || b[5] < 2 || b[6] < 2 || b[5] * b[6] > 480 * 272 * 0.9) return;

}
var DRAG = null;
var elKey = TC.elKey, elOf = TC.elOf;   // настройки отдельных элементов живут в ядре (EL), здесь только доступ

  else if (SELEL.kind !== 'node' && SELEL.name) { var e = elOf(SELEL.key); e.dx = (e.dx | 0) + ddx; e.dy = (e.dy | 0) + ddy; }

  if (DRAG || !LAST || !UI.meas) return; var r = scr.getBoundingClientRect(), k = r.width / 480, h = hitElement((e.clientX - r.left) / k, (e.clientY - r.top) / k);
  var key = h ? h.kind + '|' + h.key + '|' + h.rect.join(',') : ''; if (key === HOVERKEY) return; HOVERKEY = key;

});

// замечания: к выбранному элементу и к странице; память браузера + файл ui_notes.json
var NOTES = [], NOTES_KEY = 'shar-typo-notes-v1';
try { NOTES = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]') || []; } catch (e) { NOTES = []; }
function saveNotes() { try { localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); } catch (e) { } }
function addNote(text, el) {
  text = (text || '').trim(); if (!text) return false; var sc = T.scenes[UI.scene];
  NOTES.push({id: Date.now() + '-' + NOTES.length, ts: new Date().toISOString().slice(0, 19).replace('T', ' '), scene: sc.id, sceneTitle: sc.title, about: el ? 'элемент' : 'страница',
    group: el && el.gid ? el.gid : null, groupTitle: el && el.gid && GROUP[el.gid] ? GROUP[el.gid].title : null, element: el ? (el.label || el.name) : null, key: el ? el.key : null, kind: el ? el.kind : null,
    rect: el ? el.rect : null, point: el ? [el.x, el.y] : null, shift: el && el.gid && ST[el.gid] ? [ST[el.gid].dx | 0, ST[el.gid].dy | 0] : null, text: text});

function noteLine(n) { return '[' + n.ts + '] ' + n.sceneTitle + ' · ' + (n.about === 'страница' ? 'страница' : (n.groupTitle || 'без группы') + ' · «' + (n.element || '') + '»' + (n.rect ? ' (' + n.rect.join(', ') + ')' : '')) + ': ' + n.text; }
function buildNotes() {
  var host = document.getElementById('notes'); if (!host) return; var sc = T.scenes[UI.scene]; host.innerHTML = '';
  host.appendChild(el('h3', null, 'Замечания'));
  var info = el('div', 'selinfo'); info.textContent = SELEL && SELEL.scene === UI.scene ? 'выбрано: ' + (SELEL.gid && GROUP[SELEL.gid] ? GROUP[SELEL.gid].title : 'без группы') + ' · ' + SELEL.label + (SELEL.rect ? ' · ' + SELEL.rect.join(', ') : '') + ' (Esc — снять; перетаскивание двигает группу, Alt — только элемент)' : 'кликните по элементу на экране, чтобы оставить замечание к нему';
  host.appendChild(info);
  if (SELEL && SELEL.scene === UI.scene && SELEL.kind !== 'node' && SELEL.name) {   // настройки отдельного элемента (не группы): сдвиг X/Y; перетаскивание с Alt и стрелки с Alt двигают только его
    var ek = SELEL.key;
    host.appendChild(mkScrub('Элемент: сдвиг X', {min: -60, max: 60, step: 1, def: 0}, function () { return (TC.getEL()[ek] || {}).dx | 0; }, function (v) { var e = elOf(ek), d = Math.round(v) - (e.dx | 0); e.dx = Math.round(v); if (SELEL && SELEL.rect) SELEL.rect = [SELEL.rect[0] + d, SELEL.rect[1], SELEL.rect[2], SELEL.rect[3]]; onChange(); }, 'только этот элемент («' + SELEL.name + '»), поверх группы; Alt+перетаскивание и Alt+стрелки', function (v) { return (v > 0 ? '+' : '') + Math.round(v) + ' px'; }));
    var scaleRows = function (lab, key, hint) { host.appendChild(mkScrub(lab, {min: 0.05, max: 4, step: 0.01, def: 1}, function () { var e = TC.getEL()[ek]; return e && e[key] ? e[key] : 1; }, function (v) { elOf(ek)[key] = Math.round(v * 1000) / 1000; SELEL.rect = null; onChange(); }, hint, function (v) { return '×' + (+v).toFixed(2); })); };
    if (SELEL.kind === 'stat' || SELEL.kind === 'rect') { scaleRows('Элемент: масштаб', 'k', 'размер картинки целиком, центр на месте'); scaleRows('Элемент: ширина ×', 'w', 'ширина плашки/рамки отдельно, поверх масштаба'); scaleRows('Элемент: высота ×', 'h', 'высота плашки/рамки отдельно, поверх масштаба'); }
    else if (SELEL.kind === 'num') scaleRows('Элемент: масштаб', 'k', 'размер букв-картинок надписи или числа');
    else if (SELEL.kind === 'text') scaleRows('Элемент: размер текста', 'k', 'размер шрифта этой надписи (×1 — как у группы), центр строки на месте; пиксельные грани (Bart, MSX) растут только целыми ×1, ×2…');

function notesJson() { return {version: 1, target: 'shar-psp/build/ТИПОГРАФИКА_ПАНЕЛЬ/notes.json', made: new Date().toISOString().slice(0, 16).replace('T', ' '), notes: NOTES}; }
